name: Android build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build, test, and lint
        run: ./gradlew verify build --no-daemon --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tonewire-apks
          if-no-files-found: error
          path: |
            android/phone/build/outputs/apk/debug/*.apk
            android/phone/build/outputs/apk/release/*.apk
            android/tv/build/outputs/apk/debug/*.apk
            android/tv/build/outputs/apk/release/*.apk
